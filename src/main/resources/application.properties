spring.application.name=hermes

# ── Banco de dados Oracle (FIAP) — ambiente padrao ───────────────────
# As credenciais NAO ficam no repositorio. Vem de variaveis de ambiente
# (ORACLE_HOST, ORACLE_PORTA, ORACLE_SID, ORACLE_USUARIO e ORACLE_SENHA) ou,
# na maquina local, do arquivo application-local.properties (ignorado pelo Git).
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_HOST:oracle.fiap.com.br}:${ORACLE_PORTA:1521}:${ORACLE_SID:ORCL}
spring.datasource.username=${ORACLE_USUARIO}
spring.datasource.password=${ORACLE_SENHA}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool enxuto: o ambiente academico limita sessoes simultaneas por usuario
spring.datasource.hikari.pool-name=HermesPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
# Traz os CLOBs junto com a linha (ate 256 KB cada), sem uma ida ao banco por
# coluna: o painel le todas as reunioes analisadas e ficava muito lento.
spring.datasource.hikari.data-source-properties.oracle.jdbc.defaultLobPrefetchSize=262144

# ── JPA / Hibernate ──────────────────────────────────────────────────
# O dialeto e detectado automaticamente a partir do driver conectado.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Boa pratica: sessao JPA nao fica aberta na camada web.
# As consultas usam JOIN FETCH e os controllers so manipulam DTOs.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Servidor / API REST ──────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
spring.main.banner-mode=off

# Upload de CSV de transcricoes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Serializacao JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Documentacao OpenAPI / Swagger UI ────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ── Diretorio padrao onde os PDFs sao gerados ────────────────────────
hermes.relatorios.diretorio=./relatorios

# ── CORS (Front-End) ─────────────────────────────────────────────────
hermes.cors.origens=${HERMES_CORS_ORIGENS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://127.0.0.1:5500}

# ── Hermes Chat ──────────────────────────────────────────────────────
# Assistente conversacional (POST /api/v1/chat). As chaves NUNCA ficam no
# repositorio nem no front: so em variaveis de ambiente.
hermes.chat.habilitado=${HERMES_CHAT_HABILITADO:true}
hermes.chat.max-caracteres-pergunta=600
hermes.chat.max-turnos-historico=6
hermes.chat.limite-por-minuto-ip=8
hermes.chat.timeout-segundos=40

# Provedores em ordem de prioridade (todos no formato OpenAI /chat/completions).
# Provedor sem chave e ignorado; se nenhum tiver chave, o chat responde 503.
hermes.llm.provedores[0].nome=openrouter
hermes.llm.provedores[0].url=https://openrouter.ai/api/v1/chat/completions
hermes.llm.provedores[0].chave=${OPENROUTER_API_KEY:}
hermes.llm.provedores[0].modelo=${HERMES_MODELO:nousresearch/hermes-3-llama-3.1-405b:free}

hermes.llm.provedores[1].nome=groq
hermes.llm.provedores[1].url=https://api.groq.com/openai/v1/chat/completions
hermes.llm.provedores[1].chave=${GROQ_API_KEY:}
# llama-3.3-70b-versatile foi aposentado pelo Groq em ago/2026
hermes.llm.provedores[1].modelo=${GROQ_MODELO:openai/gpt-oss-120b}

# Local (opcional): o Ollama expoe a mesma API. Descomente para usar.
# hermes.llm.provedores[2].nome=ollama
# hermes.llm.provedores[2].url=http://localhost:11434/v1/chat/completions
# hermes.llm.provedores[2].chave=ollama
# hermes.llm.provedores[2].modelo=hermes3:8b

# ── Logs ──────────────────────────────────────────────────────────────
logging.level.root=ERROR
logging.level.br.com.totvs=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework=ERROR
