spring.application.name=hermes

# ── Banco de dados Oracle (FIAP) — ambiente padrao ───────────────────
# As credenciais podem ser sobrescritas por variaveis de ambiente, sem
# recompilar: ORACLE_HOST, ORACLE_PORTA, ORACLE_SID, ORACLE_USUARIO e ORACLE_SENHA.
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_HOST:oracle.fiap.com.br}:${ORACLE_PORTA:1521}:${ORACLE_SID:ORCL}
spring.datasource.username=${ORACLE_USUARIO:rm561459}
spring.datasource.password=${ORACLE_SENHA:060107}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool enxuto: o ambiente academico limita sessoes simultaneas por usuario
spring.datasource.hikari.pool-name=HermesPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ── JPA / Hibernate ──────────────────────────────────────────────────
# O dialeto e detectado automaticamente a partir do driver conectado.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Boa pratica: sessao JPA nao fica aberta na camada web.
# As consultas usam JOIN FETCH e os controllers so manipulam DTOs.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Servidor / API REST ──────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
spring.main.banner-mode=off

# Upload de CSV de transcricoes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Serializacao JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Documentacao OpenAPI / Swagger UI ────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ── Diretorio padrao onde os PDFs sao gerados ────────────────────────
hermes.relatorios.diretorio=./relatorios

# ── CORS (Front-End) ─────────────────────────────────────────────────
hermes.cors.origens=http://localhost:3000,http://localhost:4200,http://localhost:5173,http://127.0.0.1:5500

# ── Logs ──────────────────────────────────────────────────────────────
logging.level.root=ERROR
logging.level.br.com.totvs=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework=ERROR
