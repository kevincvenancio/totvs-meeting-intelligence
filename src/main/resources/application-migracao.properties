# Perfil "migracao": copia os dados do H2 local para o Oracle da FIAP e encerra.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=migracao
#
# O destino e a conexao padrao (Oracle, definida em application.properties);
# a origem e o banco H2 em arquivo configurado abaixo.
spring.main.web-application-type=none

insight360.migracao.origem.url=jdbc:h2:file:./data/insight360
insight360.migracao.origem.usuario=sa
insight360.migracao.origem.senha=

logging.level.br.com.totvs.insight360.migracao=INFO
